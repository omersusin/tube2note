[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tube2note"
version = "0.1.4"
description = "YouTube channels, playlists and videos to a single Markdown file for NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["youtube", "transcript", "markdown", "notebooklm", "cli", "rag"]dependencies = ["yt-dlp"]

[project.optional-dependencies]
pdf = ["fpdf2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
tube2note = "tube2note:main"
yt = "tube2note:main"

[project.urls]
Homepage = "https://github.com/omersusin/tube2note"
Repository = "https://github.com/omersusin/tube2note"
Issues = "https://github.com/omersusin/tube2note/issues"

[tool.setuptools]
py-modules = ["tube2note"]
