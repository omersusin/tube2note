[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tube2note"
dynamic = ["version"]
description = "YouTube channels, playlists and videos to a single Markdown file for NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["youtube", "transcript", "markdown", "notebooklm", "cli", "rag", "yt-dlp", "web-ui"]
dependencies = ["yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
pdf = ["fpdf2"]
dev = ["pytest", "ruff", "build"]

[project.scripts]
tube2note = "tube2note.cli:main"
yt = "tube2note.cli:main"

[project.urls]
Homepage = "https://github.com/omersusin/tube2note"
Repository = "https://github.com/omersusin/tube2note"
Issues = "https://github.com/omersusin/tube2note/issues"

[tool.setuptools]
packages = ["tube2note"]

[tool.setuptools.dynamic]
version = { attr = "tube2note.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
